services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: always
    env_file: .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    env_file: .env
    restart: always
    secrets:
      - db_password
    volumes:
      - wp_data:/var/www/wordpress
    depends_on: 
      - mariadb
    networks: 
      - inception

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-/home/migugar2/data}/mariadb
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-/home/migugar2/data}/wordpress

networks:
  inception:
    driver: bridge

